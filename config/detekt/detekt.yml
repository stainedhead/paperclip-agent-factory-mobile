# Builds on detekt's defaults. Deviations are listed here with the reason, never as inline suppressions.
# Every rule block below needs a comment line directly above it saying why it deviates (checked by DetektConfigRulesTest).
# Zero issues is the gate (AGENTS.md); detekt's default of tolerating some issues would let the count creep up.
build:
  maxIssues: 0

style:
  # Constants are named where they are declared, so `const val X = 5` is not flagged (the default flags it).
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  # A parser or mapper with a guard clause per invalid input needs more than the default 2 returns; guards stay uncounted.
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  # Restates the default (120), which is also the ktlint and .editorconfig limit, so the three cannot drift apart silently.
  MaxLineLength:
    maxLineLength: 120
  # The default is inactive; unused private members are dead code that review kept finding (F-A-12).
  UnusedPrivateMember:
    active: true

naming:
  # Test functions use backticked sentences; Compose functions that emit UI are PascalCase nouns (Compose API guidelines).
  FunctionNaming:
    ignoreAnnotated: ['Test', 'Composable']
  # Constants may carry digits and underscores, for example `START_EPOCH_SECONDS` or `HTTP_429`.
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  # A composable takes its content, its modifier and a few options with defaults; that is how Compose APIs are shaped.
  LongParameterList:
    ignoreAnnotated: ['Composable']
  # A design-system file holds one function per component, and the label file one `@StringRes` mapping per key enum;
  # the count is the point of those files.
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'StringRes']
  # Restates the default (60) so that raising it is a visible edit to this file.
  LongMethod:
    threshold: 60
  # Restates the default (15) so that raising it is a visible edit to this file.
  # An exhaustive `when` over an enum that returns one constant per entry (the key-to-string mappings) is a table, not
  # branching logic; detekt counts it as one when its entries are simple.
  CyclomaticComplexMethod:
    threshold: 15
    ignoreSimpleWhenEntries: true

exceptions:
  # The one network door (PaperclipHttpClient) must turn ANY engine failure (OkHttp, Darwin, TLS, platform) into a typed
  # DomainError, and engines throw arbitrary Throwables. CancellationException is rethrown before the catch-all, and
  # nothing else in the codebase may catch Throwable.
  TooGenericExceptionCaught:
    excludes: ['**/infrastructure/api/**/PaperclipHttpClient.kt']
