name: iosApp
options:
  bundleIdPrefix: com.stainedhead.paperclipmobile
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
packages:
  PaperclipKit:
    path: Packages/PaperclipKit
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [Sources/App]
    dependencies:
      - package: PaperclipKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stainedhead.paperclipmobile
        INFOPLIST_KEY_CFBundleDisplayName: Paperclip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/iosAppTests]
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stainedhead.paperclipmobile.tests
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/iosAppUITests]
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stainedhead.paperclipmobile.uitests
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets:
        - iosAppTests
        - iosAppUITests
