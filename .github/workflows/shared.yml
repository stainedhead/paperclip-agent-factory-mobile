name: shared

# Shared Kotlin core: formatting, static analysis, architecture rules, tests (JVM and Android host), coverage gates.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Format, static analysis, lint, tests, architecture rules, coverage
        # check = spotlessCheck + detekt + Android Lint + allTests (JVM, Android host) + konsistTest + koverVerify
        run: ./gradlew check lint --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shared-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
