name: security

# Secret scanning on every change. Dependency updates come from Dependabot (.github/dependabot.yml).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker build --quiet --tag pafm-gitleaks docker/gitleaks
          docker run --rm -v "$PWD:/repo" pafm-gitleaks \
            git /repo --config /repo/.gitleaks.toml --redact --verbose
