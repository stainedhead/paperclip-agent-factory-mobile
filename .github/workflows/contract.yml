name: contract

# Starts the pinned Paperclip server (authenticated mode) in Docker and runs scripts/contract-smoke.sh against it: the
# anonymous /api/health fields and the pairing challenge shapes the app relies on. Phase 1b adds the Kotlin contract
# tests to this job. Nightly (and on manual dispatch, never on a pull request) the same script runs against the newest
# published image; that job has no continue-on-error, so API drift turns the scheduled run red.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths:
      - "docker/paperclip-test/**"
      - "scripts/paperclip-test-server.sh"
      - "gradle/libs.versions.toml"
      - "shared/infrastructure/api/**"
      - ".github/workflows/contract.yml"

permissions:
  contents: read

jobs:
  pinned:
    name: pinned server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start the pinned Paperclip server
        run: ./scripts/paperclip-test-server.sh up
      - name: Contract smoke checks (health and pairing challenge shapes)
        run: ./scripts/contract-smoke.sh
      - name: Server logs
        if: failure()
        run: ./scripts/paperclip-test-server.sh dump
      - name: Stop the server
        if: always()
        run: ./scripts/paperclip-test-server.sh down

  latest:
    name: latest server (drift check)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPERCLIP_SERVER_VERSION: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start the latest Paperclip server
        run: ./scripts/paperclip-test-server.sh up
      - name: Contract smoke checks against latest (a failure here means the API drifted)
        run: ./scripts/contract-smoke.sh
      - name: Server logs
        if: failure()
        run: ./scripts/paperclip-test-server.sh dump
      - name: Stop the server
        if: always()
        run: ./scripts/paperclip-test-server.sh down
