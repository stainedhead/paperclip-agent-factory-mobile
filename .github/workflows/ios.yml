name: ios

# iPhone app: Kotlin/Native tests, the PaperclipKit XCFramework, SwiftLint, swift-format, then Xcode unit and UI tests.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install tools
        run: brew install swiftlint xcodegen
      - name: Kotlin/Native tests (iOS simulator)
        run: ./gradlew iosSimulatorArm64Test
      - name: Build PaperclipKit.xcframework
        run: ./scripts/build-kit.sh debug
      - name: SwiftLint
        run: swiftlint --strict
      - name: swift-format
        run: xcrun swift-format lint --recursive --strict iosApp/Sources iosApp/Tests iosApp/Packages/PaperclipKit/Package.swift
      - name: Xcode unit and UI tests
        run: ./scripts/ios-test.sh
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
