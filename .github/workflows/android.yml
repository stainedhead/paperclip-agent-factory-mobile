name: android

# Android app: Android Lint, unit tests (JUnit 4 + Robolectric, JUnit 5 pure tests), Roborazzi verify, the release build,
# then the device tests of the shared modules on an emulator. Compose screenshot baselines live in androidApp/src/test.
# The Macrobenchmarks (cold start, 200 card fling) run in the `benchmark` job nightly and on demand, never per PR.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # versionCode is the commit count (androidApp/build.gradle.kts): a shallow clone would stamp every build 1.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Lint, unit tests, screenshot verification, release build
        # No upload key in CI: the smoke build is debug-signed on purpose (ADR-132), so say so (R-015).
        env:
          PAFM_ALLOW_DEBUG_SIGNED_RELEASE: "1"
        run: ./gradlew :androidApp:lint :androidApp:testDebugUnitTest :androidApp:verifyRoborazziDebug :androidApp:assembleRelease
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports
          path: |
            androidApp/build/reports/**
            androidApp/build/test-results/**
            androidApp/build/outputs/roborazzi/**
          retention-days: 7

  emulator:
    if: github.event_name != 'schedule'
    # Device tests (Keystore, connectivity, persistence, live graph) need a real Android runtime; `check` never runs them.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # versionCode is the commit count (androidApp/build.gradle.kts): a shallow clone would stamp every build 1.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            ./gradlew
            :shared:infrastructure:securestore:connectedAndroidDeviceTest
            :shared:infrastructure:platform:connectedAndroidDeviceTest
            :shared:infrastructure:persistence:connectedAndroidDeviceTest
            :shared:umbrella:connectedAndroidDeviceTest
            :androidApp:connectedDebugAndroidTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-emulator-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
          retention-days: 7

  benchmark:
    # The performance regression guard (T8.6, ADR-135): Macrobenchmark cold start (median of 10) and frame timing over a
    # 200 card Inbox on the R8-minified benchmark build with the committed baseline profile. A hosted emulator gives
    # emulator numbers, not the Pixel 6 target: it catches regressions, it does not prove the target. Nightly or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./scripts/run-benchmarks.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-benchmarks
          path: androidApp/benchmark/build/outputs/connected_android_test_additional_output/**
          retention-days: 30
