# Swift code only renders shared Kotlin state, so the rules stay close to defaults.
included:
  - iosApp
excluded:
  - iosApp/Packages
  - iosApp/Frameworks
  - iosApp/iosApp.xcodeproj
  - iosApp/build

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
  - force_unwrapping

line_length:
  warning: 120
  error: 140

disabled_rules:
  - todo

# force_cast is on by default; force_unwrapping is opt-in above. unused_import only runs in `swiftlint analyze`
# (it needs a compiler log), so it is listed for that mode and does not affect `swiftlint --strict`.
analyzer_rules:
  - unused_import
